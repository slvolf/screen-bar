; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:genericSTM32F103C8T6]
platform = ststm32  ; 基于STM32平台（兼容CH32）
board = genericSTM32F103C8  ; 兼容板型（使用 PlatformIO 通用 STM32F103C8 ID）
framework = cmsis  ; 使用CMSIS框架（内核接口）

; 上传配置（二选一）
; 方案1：WCH-Link调试器（推荐，支持下载+调试）
; upload_protocol = wch-link
; debug_tool = wch-link
; debug_init_break = tbreak main  ; 调试时在main处断住

; 方案2：USB转串口上传
upload_protocol = serial
upload_port = COM3  ; 替换为实际串口（设备管理器查看）
upload_speed = 115200

; 编译参数（适配CH32F103C8T6）
build_flags =
    -mcpu=cortex-m3  ; 明确Cortex-M3内核
    -mthumb          ; 启用Thumb指令集
    -DCH32F103C8T6   ; 自定义宏，区分芯片型号
    -Iinclude        ; 包含自定义头文件目录（若有）

; 链接脚本（指定CH32内存布局）
board_build.ldscript = ch32f103c8t6.ld